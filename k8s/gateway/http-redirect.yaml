# HTTP → HTTPS 전역 리다이렉트
# 모든 도메인의 HTTP(80) 요청을 HTTPS(443)로 301 리다이렉트
---
# 외부 게이트웨이 HTTP redirect
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: http-to-https-redirect-external
  namespace: default
spec:
  parentRefs:
    - name: external-gateway
      namespace: default
      sectionName: http
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
---
# 내부 게이트웨이 HTTP redirect
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: http-to-https-redirect-internal
  namespace: default
spec:
  parentRefs:
    - name: internal-gateway
      namespace: default
      sectionName: http
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301

